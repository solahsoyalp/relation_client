name: Publish to PyPI

# `v*` タグの push で起動し、PyPI Trusted Publisher (OIDC) を用いて自動公開する。
# API トークンは不要（GitHub の OIDC で PyPI と信頼関係を結ぶ）。
# 事前に PyPI 側で Trusted Publisher の設定が必要（詳細は RELEASING.md を参照）。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Check distribution metadata
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*

      - name: Upload built distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # 信頼できる発行元（Trusted Publisher）の対象を GitHub Environment で限定する。
    environment:
      name: pypi
      url: https://pypi.org/project/relation-client/
    permissions:
      # OIDC トークンの発行に必須（これにより API トークン不要で公開できる）。
      id-token: write
    steps:
      - name: Download built distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
