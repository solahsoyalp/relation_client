[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "relation-client"
dynamic = ["version"]
description = "Re:lation API Python クライアントライブラリ"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "solah soyalp", email = "solah.soyalp@gmail.com" },
]
dependencies = [
    # 既知脆弱性の修正版を直接要求（詳細は SECURITY.md 参照）。
    # requests>=2.33.0: CVE-2026-25645 / CVE-2024-35195 を回避
    # urllib3>=2.7.0: CVE-2026-44431 / CVE-2026-44432 を回避（いずれも Python 3.10+ 必須）
    "requests>=2.33.0",
    "urllib3>=2.7.0",
    "pytz",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.urls]
Homepage = "https://github.com/solahsoyalp/relation_client"
"Bug Reports" = "https://github.com/solahsoyalp/relation_client/issues"
Source = "https://github.com/solahsoyalp/relation_client"

[tool.setuptools.dynamic]
version = { attr = "relation_client.__version__" }

# 配布物にはライブラリ本体のみを明示列挙して含める。
# tests / examples / 開発用 scripts は配布物に含めない。
[tool.setuptools]
packages = ["relation_client", "relation_client.resources"]

[tool.setuptools.package-data]
relation_client = ["py.typed"]
