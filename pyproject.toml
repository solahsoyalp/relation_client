[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "relation-client"
dynamic = ["version"]
description = "Re:lation API Python クライアントライブラリ"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "solah soyalp", email = "solah.soyalp@gmail.com" },
]
dependencies = [
    # requests のセキュリティ方針は SECURITY.md を参照。
    # Python 3.10+ は 2.33.0 以上（CVE-2026-25645 / CVE-2024-35195 を回避）。
    # 3.8/3.9 は 2.33.0 が 3.10+ 必須のため、動作可能な最新（2.32.4 以上）を要求。
    "requests>=2.33.0; python_version >= '3.10'",
    "requests>=2.32.4; python_version < '3.10'",
    "pytz",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.urls]
Homepage = "https://github.com/solahsoyalp/relation_client"
"Bug Reports" = "https://github.com/solahsoyalp/relation_client/issues"
Source = "https://github.com/solahsoyalp/relation_client"

[tool.setuptools.dynamic]
version = { attr = "relation_client.__version__" }

[tool.setuptools.packages.find]
exclude = ["tests", "tests.*"]

[tool.setuptools.package-data]
relation_client = ["py.typed"]
